<!doctype html>
<!-- Ant farm: a glass formicarium seen face on, with a harvester-ant colony digging the sand.

     Workers dig the tunnel faces grain by grain and carry the spoil up to a mound by the entrance, foragers bring seeds
     from the surface down to a granary, nurses tend the brood and the queen, the rest sleep in the chambers. The nest
     grows slowly (about two days to fill the farm); the colony is saved (server.py's /state, or the browser's
     localStorage), so a reload doesn't reset it. Three days after the farm is full a fresh colony starts.

     With server.py running, it follows your computer's load (/load.json "heat" 0..1, polled every 2 s): the busier the
     machine is, the more ants are awake and the faster they work and dig. Without it the colony keeps a slow rhythm of
     its own.

     Canvas 2D: the sand, tunnels and still things live in one prepared layer that changes only where the ants dig;
     each frame repaints only the small patches under the ants. The glass and frame are a second, still layer.
     Made for a small portrait screen (1080x1920) but fits any window.

     Options: fps=N (default 30), heat=X (fixed load 0..1), demo=1 (load sweeping 0..1), fresh=1 (a new farm, nothing
     loaded or saved), seed=N (with fresh), grow=X (with fresh: start X of the way to a full farm, default 0.3),
     capture=1 (no clock: window.__step(n) runs n frames of 1/30 s; for recording clips), auto=N (with capture: run N
     frames at once, for a one-shot screenshot). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ant farm</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:#0a0705; overflow:hidden; cursor:none; }
  canvas { position:fixed; display:block; }
  #world { transition: opacity 6s ease; }
  #glass { pointer-events:none; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<canvas id="glass"></canvas>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const qn = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
const FPS = qn('fps', 30), CAPTURE = Q.get('capture') === '1', FRESH = Q.get('fresh') === '1';

// ---------------------------------------------------------------- layout (logical units: a 1080x1920 screen)
const LW = 1080, LH = 1920, FRAME = 30, LID = 74;
const X0 = FRAME, X1 = LW - FRAME, Y0 = LID, Y1 = LH - FRAME;
const SURF = 336, STEP = 3, TR = 18, AK = 1.2;          // sand surface, tunnel growth step, tunnel half width
const SAND_AREA = (X1 - X0) * (Y1 - SURF);
const FULL = 0.17 * SAND_AREA;                 // dug area at which the farm counts as full
const DAY = 86400e3;

// ---------------------------------------------------------------- random
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y, s) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177) | 0;
  h = Math.imul(h ^ h >>> 13, 1103515245); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const R = Math.random, rr = (a, b) => a + (b - a) * R();
const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------------------------------------------------------------- the farm (saved state)
let F = null;
function newFarm(seed) {
  const rnd = mulberry(seed);
  const ex = Math.round(400 + rnd() * 240);
  const f = { v: 1, seed, born: Date.now(), ex, pts: [], ch: [], sites: [], mound: new Array(Math.ceil(LW / 4)).fill(0),
    seeds: [], apple: { x: Math.round(ex > 520 ? ex - 300 - rnd() * 60 : ex + 300 + rnd() * 60) }, granary: 0, brood: 6, dug: 0, mature: 0,
    nextDrop: 0, lastEat: Date.now(), lastBorn: Date.now(), workers: 28 };
  f.pts.push({ x: ex, y: 0, r: TR + 3, p: -1, c: -1 });
  f.sites.push({ t: 'tip', i: 0, a: Math.PI / 2, pref: Math.PI / 2, left: 1400, n: 0, acc: 0, base: 0, bend: 0, since: -60,
    tgt: { x: Math.round(ex + (ex > 520 ? -1 : 1) * (60 + rnd() * 160)), y: Math.round(SURF + 760 + rnd() * 300) } });
  for (let k = 0; k < 9; k++) f.seeds.push({ x: Math.round(f.apple.x + (f.apple.x > ex ? -1 : 1) * (60 + rnd() * 110)), r: rnd() * 3 });
  return f;
}
let SURFB = null, PEB = [];
function setupGround() {
  const rnd = mulberry(F.seed ^ 0x51ed);
  const p1 = rnd() * 6, p2 = rnd() * 6, p3 = rnd() * 6;
  SURFB = new Float32Array(LW + 2);
  for (let x = 0; x <= LW + 1; x++) SURFB[x] = SURF + 7 * Math.sin(x * 0.0047 + p1) + 4 * Math.sin(x * 0.0131 + p2) + 1.6 * Math.sin(x * 0.033 + p3);
  F.pts[0].y = surfB(F.pts[0].x) + 6;
  PEB = [];
  for (let k = 0; k < 400 && PEB.length < 12; k++) {
    const r = 6 + Math.pow(rnd(), 1.6) * 16, x = X0 + 60 + rnd() * (X1 - X0 - 120), y = SURF + 140 + rnd() * (Y1 - SURF - 220);
    if (Math.abs(x - F.ex) < 70 && y < SURF + 420) continue;
    if (PEB.some(q => Math.hypot(q.x - x, q.y - y) < q.r + r + 90)) continue;
    PEB.push({ x, y, r, e: 0.6 + rnd() * 0.35, a: rnd() * 3, h: rnd() });
  }
}
const surfB = x => { x = clamp(x, 0, LW); const i = x | 0, f = x - i; return SURFB[i] * (1 - f) + SURFB[i + 1] * f; };
function moundAt(x) { const m = F.mound, u = clamp(x / 4, 0, m.length - 1), i = u | 0, f = u - i;
  return m[i] * (1 - f) + (m[Math.min(i + 1, m.length - 1)]) * f; }
const surfY = x => surfB(x) - moundAt(x);
const prad = i => F.pts[i].r * (0.88 + 0.24 * hash(i, 7, F.seed));

// ---------------------------------------------------------------- canvases
const world = document.getElementById('world'), glass = document.getElementById('glass');
let S = 1, DW = 0, DH = 0, wctx, gctx;
let sandC, moundC, airC, inC, maskC, terrC, mctx, tctx, tmpA, tmpB, bodyC, queenC, shadC, qshadC;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
function sizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  const k = Math.min(innerWidth / LW, innerHeight / LH);
  S = k * dpr; DW = Math.round(LW * S); DH = Math.round(LH * S);
  for (const c of [world, glass]) {
    c.width = DW; c.height = DH;
    c.style.width = (LW * k) + 'px'; c.style.height = (LH * k) + 'px';
    c.style.left = ((innerWidth - LW * k) / 2) + 'px'; c.style.top = ((innerHeight - LH * k) / 2) + 'px';
  }
  wctx = world.getContext('2d', { alpha: false });
  gctx = glass.getContext('2d');
}

// The sand: depth tone, strata and blotches at low resolution, then grain per pixel; pebbles on top.
function makeSand() {
  const rnd = mulberry(F.seed ^ 0xa11);
  const lw = 180, lh = 320, low = mk(lw, lh), lc = low.getContext('2d'), im = lc.createImageData(lw, lh), d = im.data;
  const ph = [rnd() * 6, rnd() * 6, rnd() * 6, rnd() * 6], fr = [0.021 + rnd() * 0.01, 0.047 + rnd() * 0.02, 0.11 + rnd() * 0.03];
  const vn = (x, y, s) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), e = hash(xi + 1, yi + 1, s);
    return (a + (b - a) * u) * (1 - v) + (c + (e - c) * u) * v; };
  for (let j = 0; j < lh; j++) for (let i = 0; i < lw; i++) {
    const x = i * LW / lw, y = j * LH / lh;
    const dep = clamp((y - SURF) / (Y1 - SURF), 0, 1);
    const warp = 14 * Math.sin(x * 0.006 + ph[3]) + 22 * (vn(x / 260, y / 260, F.seed) - 0.5);
    const yy = y + warp;
    const strata = 0.55 * Math.sin(yy * fr[0] + ph[0]) + 0.3 * Math.sin(yy * fr[1] + ph[1]) + 0.15 * Math.sin(yy * fr[2] + ph[2]);
    const blot = vn(x / 90, y / 90, F.seed + 3) * 0.6 + vn(x / 35, y / 35, F.seed + 5) * 0.4 - 0.5;
    // dry, pale sand at the top; damper, darker and a little redder with depth
    let r = 226 - 58 * dep, g = 184 - 62 * dep, b = 122 - 50 * dep;
    const k = 1 + 0.055 * strata + 0.07 * blot;
    // a few warmer (iron) and greyer bands
    const band = Math.sin(yy * 0.0083 + ph[1] * 2);
    r *= k * (1 + 0.035 * band); g *= k; b *= k * (1 - 0.05 * band);
    const o = (j * lw + i) * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
  }
  lc.putImageData(im, 0, 0);
  sandC = mk(DW, DH);
  const sc = sandC.getContext('2d');
  sc.imageSmoothingEnabled = true; sc.imageSmoothingQuality = 'high';
  sc.drawImage(low, 0, 0, DW, DH);
  const big = sc.getImageData(0, 0, DW, DH), p = big.data, s = F.seed;
  const gs = Math.max(1, Math.round(S * 1.4));
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    const o = (y * DW + x) * 4, cell = hash((x / gs) | 0, (y / gs) | 0, s), g = hash(x, y, s + 9);
    let f = 0.9 + 0.14 * cell + 0.06 * g, w = 0;
    if (cell < 0.018) f *= 0.72;                 // dark mineral grains
    else if (cell > 0.988) { f = 1.12; w = 0.35; } // quartz glints
    const tint = 1 + 0.05 * (hash((x / gs) | 0, (y / gs) | 0, s + 2) - 0.5);
    p[o] = Math.min(255, p[o] * f * tint + w * (255 - p[o]));
    p[o + 1] = Math.min(255, p[o + 1] * f + w * (255 - p[o + 1]));
    p[o + 2] = Math.min(255, p[o + 2] * f / tint + w * (255 - p[o + 2]));
  }
  sc.putImageData(big, 0, 0);
  // pebbles, lit from above
  sc.setTransform(S, 0, 0, S, 0, 0);
  const stones = PEB.slice();
  for (let k = 0; k < 170; k++) { const x = X0 + 10 + rnd() * (X1 - X0 - 20), y = SURF + 20 + rnd() * (Y1 - SURF - 30);
    stones.push({ x, y, r: 1.4 + Math.pow(rnd(), 2) * 4.5, e: 0.55 + rnd() * 0.4, a: rnd() * 3, h: rnd() }); }
  const PAL = [[150, 136, 120], [168, 128, 84], [128, 96, 70], [196, 186, 170], [140, 104, 60], [110, 100, 92]];
  for (const q of stones) {
    sc.save(); sc.translate(q.x, q.y); sc.rotate(q.a); sc.scale(1, q.e);
    sc.fillStyle = 'rgba(40,26,14,0.35)'; sc.beginPath(); sc.arc(0.8, 1.6, q.r + 1.2, 0, 7); sc.fill();
    const base = PAL[Math.floor(q.h * PAL.length) % PAL.length];
    const gr = sc.createRadialGradient(-q.r * 0.35, -q.r * 0.45, q.r * 0.1, 0, 0, q.r * 1.05);
    gr.addColorStop(0, `rgb(${base[0] + 55},${base[1] + 50},${base[2] + 45})`);
    gr.addColorStop(0.55, `rgb(${base[0]},${base[1]},${base[2]})`);
    gr.addColorStop(1, `rgb(${base[0] * 0.45 | 0},${base[1] * 0.42 | 0},${base[2] * 0.4 | 0})`);
    sc.fillStyle = gr; sc.beginPath();
    for (let k = 0; k <= 24; k++) { const t = k / 24 * 6.283, n = 1 + 0.13 * Math.sin(2 * t + q.h * 9) + 0.08 * Math.sin(3 * t + q.a * 5) + 0.05 * Math.sin(7 * t + q.h * 3);
      sc.lineTo(Math.cos(t) * q.r * n, Math.sin(t) * q.r * n); }
    sc.fill();
    for (let k = 0; k < q.r * 3; k++) { const t = hash(k, 1, q.x) * 6.283, u = Math.sqrt(hash(k, 2, q.y)) * q.r * 0.9;
      sc.fillStyle = `rgba(${hash(k, 3, 1) < 0.5 ? '255,255,255' : '30,20,10'},${0.06 + 0.08 * hash(k, 4, 1)})`;
      sc.fillRect(Math.cos(t) * u, Math.sin(t) * u, 1.2, 1.2); }
    // buried: sand grains over the rim
    for (let k = 0; k < q.r * 5; k++) { const t = hash(k, 8, q.x) * 6.283, u = q.r * (0.85 + 0.3 * hash(k, 9, q.y));
      const dep = clamp((q.y - SURF) / (Y1 - SURF), 0, 1), c = 0.8 + 0.25 * hash(k, 10, 3);
      sc.fillStyle = `rgba(${(226 - 58 * dep) * c | 0},${(184 - 62 * dep) * c | 0},${(122 - 50 * dep) * c | 0},0.85)`;
      sc.fillRect(Math.cos(t) * u - 0.7, Math.sin(t) * u - 0.7, 1.5, 1.5); }
    sc.restore();
  }
  sc.setTransform(1, 0, 0, 1, 0, 0);
  // the tunnels' inside: the far wall in shade
  inC = mk(DW, DH);
  const ic = inC.getContext('2d');
  ic.filter = 'brightness(0.6) saturate(1.1) contrast(0.92)'; ic.drawImage(sandC, 0, 0); ic.filter = 'none';
  // the mound: loose spoil, deeper (darker) sand mixed in
  moundC = mk(DW, DH);
  const mc = moundC.getContext('2d');
  mc.filter = 'brightness(0.9) saturate(1.08)'; mc.drawImage(sandC, 0, 0); mc.filter = 'none';
  for (let k = 0; k < DW * 90; k++) { const x = hash(k, 5, s) * DW, y = hash(k, 6, s) * SURF * S * 1.05;
    mc.fillStyle = hash(k, 7, s) < 0.6 ? 'rgba(90,62,36,0.55)' : 'rgba(236,214,170,0.5)'; mc.fillRect(x, y, gs, gs); }
}
// above the sand: the room behind the farm, dim and out of focus
function makeAir() {
  airC = mk(DW, DH);
  const a = airC.getContext('2d'), rnd = mulberry(F.seed ^ 0xb0e);
  a.setTransform(S, 0, 0, S, 0, 0);
  const g = a.createLinearGradient(0, Y0, 0, SURF + 20);
  g.addColorStop(0, '#120c09'); g.addColorStop(0.7, '#21170f'); g.addColorStop(1, '#2e2016');
  a.fillStyle = g; a.fillRect(0, 0, LW, SURF + 40);
  for (let k = 0; k < 9; k++) {
    const x = rnd() * LW, y = Y0 + 20 + rnd() * 190, r = 30 + rnd() * 70, w = 0.035 + rnd() * 0.05;
    const b = a.createRadialGradient(x, y, 0, x, y, r);
    b.addColorStop(0, `rgba(255,${170 + rnd() * 50 | 0},110,${w})`); b.addColorStop(0.8, `rgba(255,180,110,${w * 0.7})`); b.addColorStop(1, 'rgba(255,180,110,0)');
    a.fillStyle = b; a.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
}

// ---------------------------------------------------------------- the tunnel mask (white = dug)
function maskSeg(i) {
  const m = mctx, p = F.pts[i], r1 = prad(i);
  m.fillStyle = '#fff';
  if (p.p < 0) { m.beginPath(); m.arc(p.x, p.y, r1 * 1.15, 0, 7); m.fill(); return; }
  const q = F.pts[p.p], r0 = prad(p.p), d = Math.hypot(p.x - q.x, p.y - q.y), n = Math.max(1, Math.ceil(d / 1.5));
  m.beginPath();
  for (let k = 1; k <= n; k++) { const t = k / n, x = q.x + (p.x - q.x) * t, y = q.y + (p.y - q.y) * t, r = r0 + (r1 - r0) * t;
    m.moveTo(x + r, y); m.arc(x, y, r, 0, 7); }
  m.fill();
  // nibbles: a grainy wall
  const ux = (p.x - q.x) / (d || 1), uy = (p.y - q.y) / (d || 1);
  for (let k = 0; k < 2; k++) if (hash(i, 11 + k, F.seed) < 0.55) {
    const sd = k ? 1 : -1, rn = 1.5 + 2.5 * hash(i, 13 + k, F.seed);
    m.beginPath(); m.arc(p.x - uy * sd * (r1 + rn * 0.3), p.y + ux * sd * (r1 + rn * 0.3), rn, 0, 7); m.fill();
  }
}
function chamberPoly(c, g, ctx) {
  ctx.beginPath();
  for (let k = 0; k <= 56; k++) {
    const t = k / 56 * 6.283, n = 1 + 0.07 * Math.sin(3 * t + c.ph) + 0.05 * Math.sin(5 * t + c.ph * 2) + 0.025 * Math.sin(11 * t + c.ph * 3);
    const sn = Math.sin(t);
    ctx.lineTo(c.x + c.rx * g * Math.cos(t) * n, c.y + c.ry * g * (sn > 0 ? Math.min(sn, 0.62) : sn) * n);
  }
}
function maskChamber(ci) {
  const c = F.ch[ci];
  mctx.fillStyle = '#fff'; chamberPoly(c, c.g, mctx); mctx.fill();
  for (let k = 0; k < 18; k++) { const t = hash(ci, k, F.seed) * 6.283, sn = Math.sin(t), rn = 1.5 + 2.5 * hash(ci, k + 40, F.seed);
    mctx.beginPath(); mctx.arc(c.x + c.rx * c.g * Math.cos(t) * 1.01, c.y + c.ry * c.g * (sn > 0 ? Math.min(sn, 0.62) : sn) * 1.01, rn, 0, 7); mctx.fill(); }
}
function clearMaskAir(x0, x1) {
  mctx.save(); mctx.globalCompositeOperation = 'destination-out'; mctx.beginPath(); mctx.moveTo(x0, 0);
  for (let x = x0; x <= x1; x += 2) mctx.lineTo(x, surfB(x) + 1);
  mctx.lineTo(x1, 0); mctx.closePath(); mctx.fill(); mctx.restore();
}
function redrawMask() {
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, DW, DH); mctx.setTransform(S, 0, 0, S, 0, 0);
  for (let i = 0; i < F.pts.length; i++) maskSeg(i);
  for (let i = 0; i < F.ch.length; i++) maskChamber(i);
  clearMaskAir(0, LW);
}

// ---------------------------------------------------------------- composing the still layer
function tmp(c, w, h) { if (c.width < w || c.height < h) { c.width = Math.max(c.width, w); c.height = Math.max(c.height, h); }
  const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  x.filter = 'none'; x.clearRect(0, 0, w, h); return x; }
let dirty = [];
function compose(lx, ly, lw, lh) {
  const X = Math.max(0, Math.floor(lx * S)), Y = Math.max(0, Math.floor(ly * S));
  const X2 = Math.min(DW, Math.ceil((lx + lw) * S)), Y2 = Math.min(DH, Math.ceil((ly + lh) * S));
  const w = X2 - X, h = Y2 - Y; if (w <= 0 || h <= 0) return;
  const P = Math.ceil(12 * S), pw = w + 2 * P, ph = h + 2 * P;
  const t = tctx;
  t.save(); t.setTransform(1, 0, 0, 1, 0, 0); t.beginPath(); t.rect(X, Y, w, h); t.clip();
  t.drawImage(sandC, X, Y, w, h, X, Y, w, h);
  // a darker rim in the sand round every tunnel
  let a = tmp(tmpA, pw, ph);
  a.filter = `blur(${3 * S}px)`; a.drawImage(maskC, X - P, Y - P, pw, ph, 0, 0, pw, ph); a.filter = 'none';
  a.globalCompositeOperation = 'source-in'; a.fillStyle = '#1c0f06'; a.fillRect(0, 0, pw, ph);
  t.globalAlpha = 0.6; t.drawImage(tmpA, P, P, w, h, X, Y, w, h); t.globalAlpha = 1;
  // the inside
  a = tmp(tmpA, pw, ph);
  a.drawImage(maskC, X - P, Y - P, pw, ph, 0, 0, pw, ph);
  a.globalCompositeOperation = 'source-in'; a.drawImage(inC, X - P, Y - P, pw, ph, 0, 0, pw, ph);
  t.drawImage(tmpA, P, P, w, h, X, Y, w, h);
  // shade under the roof of each tunnel (light from above)
  let b = tmp(tmpB, pw, ph);
  b.drawImage(maskC, X - P, Y - P, pw, ph, 0, 0, pw, ph);
  b.globalCompositeOperation = 'destination-out'; b.drawImage(maskC, X - P, Y - P, pw, ph, 0, 9 * S, pw, ph);
  b.globalCompositeOperation = 'source-in'; b.fillStyle = '#000'; b.fillRect(0, 0, pw, ph);
  a = tmp(tmpA, pw, ph); a.filter = `blur(${3.5 * S}px)`; a.drawImage(tmpB, 0, 0, pw, ph, 0, 0, pw, ph); a.filter = 'none';
  a.globalCompositeOperation = 'destination-in'; a.drawImage(maskC, X - P, Y - P, pw, ph, 0, 0, pw, ph);
  t.globalAlpha = 0.6; t.drawImage(tmpA, P, P, w, h, X, Y, w, h); t.globalAlpha = 1;
  // loose grains on each floor
  b = tmp(tmpB, pw, ph);
  b.drawImage(maskC, X - P, Y - P, pw, ph, 0, 0, pw, ph);
  b.globalCompositeOperation = 'destination-out'; b.drawImage(maskC, X - P, Y - P, pw, ph, 0, -5 * S, pw, ph);
  b.globalCompositeOperation = 'source-in'; b.drawImage(sandC, X - P, Y - P, pw, ph, 0, 0, pw, ph);
  t.globalAlpha = 0.5; t.drawImage(tmpB, P, P, w, h, X, Y, w, h); t.globalAlpha = 1;
  // the mound and the air above the sand
  t.setTransform(S, 0, 0, S, 0, 0);
  const x0 = Math.max(0, X / S - 4), x1 = Math.min(LW, X2 / S + 4);
  if (Y / S < SURF + 40) {
    // the mound: between the old surface and the new one
    t.save(); t.beginPath();
    for (let x = x0; x <= x1 + 2; x += 2) t.lineTo(x, surfY(x));
    for (let x = x1 + 2; x >= x0; x -= 2) t.lineTo(x, surfB(x) + 1.5);
    t.closePath(); t.clip(); t.setTransform(1, 0, 0, 1, 0, 0); t.drawImage(moundC, X, Y, w, h, X, Y, w, h); t.restore();
    t.save(); t.beginPath(); t.moveTo(x0, 0);
    for (let x = x0; x <= x1 + 2; x += 2) t.lineTo(x, surfY(x));

  if (now - lastDraw < 1000 / FPS - 2) return;
  const dt = Math.min(0.1, last ? (now - last) / 1000 : 1 / FPS);
  last = now; lastDraw = now;
  frame(dt);
}
// is (x, y) in the open: a tunnel, a chamber or the air (m: margin from the wall, negative = tolerance)
function inside(x, y, m) {
  if (y < surfY(x) + 2 - m) return true;
  for (const c of F.ch) { const u = (x - c.x) / (c.rx * c.g - m), v = (y - c.y) / (c.ry * c.g * (y > c.y ? 0.62 : 1) - m); if (u * u + v * v < 1) return true; }
  for (let i = 0; i < F.pts.length; i++) { const p = F.pts[i]; if (p.p < 0) { if (Math.hypot(p.x - x, p.y - y) < p.r - m) return true; continue; }
    if (Math.abs(p.x - x) > 40 || Math.abs(p.y - y) > 40) continue;
    const q = F.pts[p.p], vx = p.x - q.x, vy = p.y - q.y, L2 = vx * vx + vy * vy || 1, t = clamp(((x - q.x) * vx + (y - q.y) * vy) / L2, 0, 1);

// a test: how many ants stand in solid sand (their middle or head outside any tunnel, chamber or the air)
function solidCount() {

  let n = 0; for (const a of ants) { const hx = a.x + Math.cos(a.a) * 7 * a.sz, hy = a.y + Math.sin(a.a) * 7 * a.sz; if (!inside2(a.x, a.y) || !inside2(hx, hy)) n++; }

}
function segs(a) { const k = a.sz * AK * (a.queen ? 1.25 : 1), c = Math.cos(a.a), s = Math.sin(a.a);
  return [a.x - c * 15 * k, a.y - s * 15 * k, a.x + c * 10 * k, a.y + s * 10 * k]; }

  const d = (px, py, ax, ay, bx, by) => { const vx = bx - ax, vy = by - ay, t = clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy || 1), 0, 1); return Math.hypot(ax + vx * t - px, ay + vy * t - py); };

}

(async function main() {
  try {
    F = await load();
    let fresh = false;

    if (fresh) { setupGround(); presim(FRESH ? qn('grow', 0.3) : 0.3); }

    window.__stats = () => ({ ants: ants.length, awake: ants.filter(a => a.state === 'job').length, pts: F.pts.length, chambers: F.ch.length,
      dug: Math.round(F.dug / FULL * 100) + '%', sites: F.sites.length, seeds: F.seeds.length, heat: +heat.toFixed(2), solid: solidCount(), overlap: overlapCount() });
